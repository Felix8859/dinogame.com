<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    font-family:Arial,sans-serif;
    background:#d9c38a;
}

/* ÉG */
.sky{
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(to bottom,#87ceeb,#f5d28c);
}

/* HEGYEK */
.mountain{
    position:absolute;
    bottom:70px;
    width:0;
    height:0;
    border-left:180px solid transparent;
    border-right:180px solid transparent;
    border-bottom:250px solid #7a5b3a;
}

.m1{left:5%;}
.m2{left:35%;}
.m3{left:65%;}

/* TALAJ */
.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:70px;
    background:#996633;
    border-top:5px solid #5c3d1e;
}

/* GAME */
.game{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* DÍNÓ */
.dino{
    position:absolute;
    left:120px;
    bottom:70px;
    font-size:80px;

    /* EZ FORDÍTJA MEG */
    transform:scaleX(-1);
}

/* KAKTUSZ */
.cactus{
    position:absolute;
    bottom:70px;
    right:-100px;
}

/* SCORE */
.score{
    position:absolute;
    top:15px;
    left:20px;
    font-size:35px;
    color:white;
    text-shadow:2px 2px 5px black;
    z-index:10;
}

/* GAME OVER */
.gameover{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    display:none;
    z-index:20;
}

.gameover h1{
    color:red;
    font-size:70px;
    margin-bottom:20px;
    text-shadow:0 0 10px black;
}

button{
    padding:15px 35px;
    font-size:25px;
    border:none;
    border-radius:15px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}

.info{
    position:absolute;
    bottom:10px;
    width:100%;
    text-align:center;
    color:white;
    font-size:24px;
    text-shadow:1px 1px 5px black;
}
</style>
</head>

<body>

<div class="game">

    <!-- HÁTTÉR -->
    <div class="sky"></div>

    <div class="mountain m1"></div>
    <div class="mountain m2"></div>
    <div class="mountain m3"></div>

    <div class="ground"></div>

    <!-- SCORE -->
    <div class="score" id="score">
        Score: 0
    </div>

    <!-- DÍNÓ -->
    <div class="dino" id="dino">
        🦖
    </div>

    <!-- KAKTUSZ -->
    <div class="cactus" id="cactus">
        🌵
    </div>

    <!-- GAME OVER -->
    <div class="gameover" id="gameover">

        <h1>💀 Game Over</h1>

        <button onclick="restartGame()">
            🔄 Újraindítás
        </button>

    </div>

    <div class="info">
        SPACE = ugrás 🚀
    </div>

</div>

<script>
const dino = document.getElementById("dino");
const cactus = document.getElementById("cactus");
const scoreText = document.getElementById("score");
const gameover = document.getElementById("gameover");

let dinoY = 70;
let velocity = 0;
let gravity = 1;

let jumping = false;

let cactusX = window.innerWidth;

let score = 0;

let running = true;

/* RANDOM MÉRET */
let cactusSize = 60;

function randomCactus(){

    cactusSize = Math.random() > 0.5 ? 60 : 100;

    cactus.style.fontSize = cactusSize + "px";

}

randomCactus();

/* UGRÁS */
document.addEventListener("keydown", (e)=>{

    if(e.code === "Space" && !jumping && running){

        velocity = 20;
        jumping = true;

    }

});

/* GAME LOOP */
function gameLoop(){

    if(!running) return;

    /* DÍNÓ */
    velocity -= gravity;
    dinoY += velocity;

    if(dinoY <= 70){

        dinoY = 70;
        velocity = 0;
        jumping = false;

    }

    dino.style.bottom = dinoY + "px";

    /* KAKTUSZ */
    cactusX -= 10;

    if(cactusX < -100){

        cactusX = window.innerWidth + 200;

        randomCactus();

    }

    cactus.style.left = cactusX + "px";

    /* ÜTKÖZÉS */
    if(

        cactusX < 180 &&
        cactusX > 90 &&
        dinoY < cactusSize + 30

    ){

        endGame();

    }

    /* SCORE */
    score += 0.1;

    scoreText.innerHTML =
    "Score: " + Math.floor(score);

    requestAnimationFrame(gameLoop);

}

requestAnimationFrame(gameLoop);

/* GAME OVER */
function endGame(){

    running = false;

    gameover.style.display = "block";

}

/* RESTART */
function restartGame(){

    location.reload();

}
</script>

</body>
</html>
